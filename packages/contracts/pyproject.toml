[project]
name = "accounting-contracts"
version = "0.1.0"
description = "Contracts, DTOs and configuration schemas for Telegram accounting bot"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "accounting-domain",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "persiantools>=6.2.0,<6.3.0",
]

[tool.uv.sources]
accounting-domain = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
